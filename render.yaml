services:
  - type: web
    name: fogo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FOGO_MODE
        value: simulation
      - key: DATABASE_URL
        fromDatabase:
          name: fogo-db
          property: connectionString

databases:
  - name: fogo-db
    plan: free
    databaseName: fogo_simulation
    user: fogo
