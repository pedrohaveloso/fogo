repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: pnpm exec oxfmt --check
        language: system
        pass_filenames: false
        always_run: true
      - id: oxlint
        name: oxlint
        entry: pnpm exec oxlint --deny-warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: tsc
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: vitest
        name: vitest
        entry: pnpm test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
